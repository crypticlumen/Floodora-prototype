services:
  floodora:
    build: .
    ports:
      - "8000:8000"
    environment:
      FLOODORA_CORS_ORIGINS: ${FLOODORA_CORS_ORIGINS:-}
      FLOODORA_SENSOR_NAME: ${FLOODORA_SENSOR_NAME:-Drain sensor REST API}
      FLOODORA_SENSOR_URL: ${FLOODORA_SENSOR_URL:-}
      FLOODORA_SENSOR_API_TOKEN: ${FLOODORA_SENSOR_API_TOKEN:-}
      FLOODORA_SENSOR_AUTH_HEADER: ${FLOODORA_SENSOR_AUTH_HEADER:-Authorization}
      FLOODORA_SENSOR_AUTH_SCHEME: ${FLOODORA_SENSOR_AUTH_SCHEME:-Bearer}
      FLOODORA_SENSOR_API_TOKEN_PARAM: ${FLOODORA_SENSOR_API_TOKEN_PARAM:-}
      FLOODORA_SENSOR_TIMEOUT_SECONDS: ${FLOODORA_SENSOR_TIMEOUT_SECONDS:-8}
      FLOODORA_SENSOR_PIN_PARAM: ${FLOODORA_SENSOR_PIN_PARAM:-pincode}
      FLOODORA_SENSOR_DEVICE_PARAM: ${FLOODORA_SENSOR_DEVICE_PARAM:-device_id}
      FLOODORA_SENSOR_DEVICE_MAP: '${FLOODORA_SENSOR_DEVICE_MAP:-}'
      FLOODORA_SENSOR_FIELD_MAP: '${FLOODORA_SENSOR_FIELD_MAP:-}'
    restart: unless-stopped
